name: 🐛 Bug report
description: Something is broken or doesn't behave as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out every section — bugs without reproduction steps get closed.

        Before submitting, please [search existing issues](../../issues) to avoid duplicates.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences describing the problem.
      placeholder: "When I click 'Delete row' in the data browser, the app crashes."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps. Include sample SQL or schema if relevant.
      placeholder: |
        1. Connect to a Postgres database
        2. Open the `public.users` table in the data browser
        3. Select a row and click Delete
        4. Observe crash
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sequelit version
      description: Settings → About, or check `src-tauri/tauri.conf.json` if you're running from source.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux (Ubuntu / Debian)
        - Linux (other)
        - Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 14.3 / Ubuntu 22.04 / Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database engine
      description: Which database were you connected to when the bug happened?
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQLite
        - SQL Server
        - Redshift
        - CockroachDB
        - Other / multiple
        - N/A — not database related
    validations:
      required: true

  - type: input
    id: db-version
    attributes:
      label: Database version
      placeholder: "Postgres 16.2 / MySQL 8.0.36 / N/A"

  - type: textarea
    id: logs
    attributes:
      label: Console output / logs
      description: Paste any error messages, stack traces, or terminal output. Open DevTools (Cmd/Ctrl + Shift + I) for renderer logs.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, links to related issues, theories about the cause — all welcome.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I'm running the latest release (or noted my older version above).
          required: true
