name: ✨ Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! A good feature request starts with a **use case**, not a solution. The clearer the problem, the better the eventual design.

        For large or design-heavy proposals, please open a [Discussion](../../discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're stuck in. Avoid jumping to a specific solution here.
      placeholder: "When working with large tables, the data browser is slow because filters only apply to the current page."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mockups, sketches, or rough UX flows are great.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this affect?
      options:
        - SQL Editor
        - Data Browser
        - Schema Browser / Inspector
        - ERD Tool
        - Schema Diff
        - Dashboard / Monitoring
        - Roles & Permissions
        - Import / Export
        - Backup & Restore
        - AI Assistant
        - Connection Manager / SSH / TLS
        - Cloud Workspaces / Team
        - Plugin System
        - Build / Release / Tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links to similar features in other tools, references, screenshots — all welcome.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: I've read PROJECT.md and this fits the project's vision (local-first, free, no telemetry, AGPL-compatible).
          required: true
